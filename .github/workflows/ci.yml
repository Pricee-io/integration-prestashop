name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: PrestaShop Module CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start services
        run: make start

      # Before PHPStan: it boots PrestaShop, and cache folders it creates during
      # the install would not be writable by the installer (www-data)
      - name: Wait for PrestaShop installation
        run: |
          for i in $(seq 1 240); do
            if [ "$(docker inspect -f '{{.State.Running}}' prestashop_app)" != "true" ]; then
              # The 9.2 image can exit right after a successful install:
              # restarting skips the install and starts the web server
              if docker logs prestashop_app 2>&1 | grep -q 'Installation successful'; then
                docker start prestashop_app
              else
                docker logs prestashop_app || true
                exit 1
              fi
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ]; then
              echo "Shop is up (HTTP $code)"
              exit 0
            fi
            sleep 5
          done
          docker logs prestashop_app || true
          exit 1
        timeout-minutes: 25

      - name: Run lint check
        run: make lint_ci

      - name: Run static analysis
        run: make analyze_ci

      - name: Run integration tests
        run: make test

      - name: Stop services
        run: make stop
