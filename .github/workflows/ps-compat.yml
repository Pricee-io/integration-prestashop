name: PrestaShop compatibility

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install-and-analyze:
    name: PS ${{ matrix.ps }} - install module, PHPStan and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported version (ps_versions_compliancy min)
          - ps: '1.7.8.11'
            db: 'mariadb:10.6'
            # Standalone PHPUnit matching the image's PHP (7.4 here)
            phpunit: '9.6'
          # Mid-range 8.x
          - ps: '8.2.1'
            db: 'mariadb:10.11'
            phpunit: '9.6'
          # Latest supported version (ps_versions_compliancy max)
          - ps: '9.2.1-apache'
            db: 'mariadb:11.4'
            phpunit: '12'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image (used to run PHPStan)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dev
          tags: pricee-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install PHP dependencies (root, needed by PHPStan)
        run: docker run --rm -v "$PWD":/app -w /app pricee-dev composer install --no-interaction

      - name: Start database
        run: |
          docker network create psnet
          docker run -d --name psdb --network psnet \
            -e MARIADB_DATABASE=prestashop \
            -e MARIADB_USER=prestashop \
            -e MARIADB_PASSWORD=prestashop \
            -e MARIADB_ROOT_PASSWORD=root \
            ${{ matrix.db }}
          for i in $(seq 1 60); do
            if docker exec psdb mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "Database is up"
              exit 0
            fi
            sleep 5
          done
          docker logs psdb || true
          exit 1
        timeout-minutes: 6

      - name: Start PrestaShop and auto-install the shop
        run: |
          docker volume create psweb
          docker run -d --name psapp --network psnet -p 8081:80 -v psweb:/var/www/html \
            -e PS_INSTALL_AUTO=1 \
            -e PS_DOMAIN=localhost:8081 \
            -e PS_LANGUAGE=en \
            -e PS_COUNTRY=US \
            -e PS_FOLDER_ADMIN=admin \
            -e ADMIN_MAIL=admin@example.com \
            -e ADMIN_PASSWD=prestashop_demo \
            -e DB_SERVER=psdb \
            -e DB_NAME=prestashop \
            -e DB_USER=prestashop \
            -e DB_PASSWD=prestashop \
            -e DB_PREFIX=ps_ \
            prestashop/prestashop:${{ matrix.ps }}

      - name: Wait for installation to finish
        run: |
          for i in $(seq 1 240); do
            if ! docker ps --format '{{.Names}}' | grep -q '^psapp$'; then
              # Some images (e.g. 9.2) exit right after a successful install:
              # the entrypoint runs "rm -r install/" but the installer already
              # removed it. Restarting skips the install block (parameters
              # file present) and starts the web server.
              if docker logs psapp 2>/dev/null | grep -q 'Installation successful'; then
                echo "Install done, restarting container to start the web server"
                docker start psapp
              else
                echo "psapp container exited during install"
                docker logs psapp || true
                exit 1
              fi
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ]; then
              echo "Shop is up (HTTP $code)"
              exit 0
            fi
            if [ $((i % 12)) -eq 0 ]; then
              echo "still waiting (front office HTTP $code)..."
            fi
            sleep 5
          done
          docker logs psapp || true
          exit 1
        timeout-minutes: 25

      - name: Install the module
        run: |
          docker run --rm -v "$PWD":/app -w /app/pricee pricee-dev composer dump-autoload
          docker cp pricee psapp:/var/www/html/modules/pricee
          docker exec psapp php bin/console prestashop:module install pricee
          docker exec psapp php bin/console prestashop:module enable pricee || true

      - name: Check the module is installed and active
        run: |
          ACTIVE=$(docker exec psdb mariadb prestashop -uprestashop -pprestashop -N -e "SELECT active FROM ps_module WHERE name='pricee';")
          echo "pricee active = $ACTIVE"
          [ "$ACTIVE" = "1" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
          echo "Front office HTTP $code, module is active"

      # Only the module: the tests run on the dev PrestaShop version only
      - name: Run PHPStan against this PrestaShop version
        run: |
          docker run --rm -v "$PWD":/app -w /app \
            -v psweb:/var/www/html \
            -e _PS_ROOT_DIR_=/var/www/html \
            pricee-dev php vendor/bin/phpstan analyse pricee --error-format=github --memory-limit=1G --no-progress

      # The tests run inside the shop container, on a disposable copy of its
      # database (tests/prepare-test-db.sh). Older PrestaShop versions cannot
      # switch multistore during a run, so the suite runs once single-shop and
      # once multistore: each run skips the tests needing the other mode.
      - name: Prepare integration tests
        run: |
          docker exec psapp mkdir -p /app
          docker cp tests psapp:/app/tests
          docker cp pricee psapp:/app/pricee
          docker cp phpunit.xml.dist psapp:/app/phpunit.xml.dist
          docker exec psapp sh -c 'curl -sSL -o /usr/local/bin/phpunit https://phar.phpunit.de/phpunit-${{ matrix.phpunit }}.phar && chmod +x /usr/local/bin/phpunit && chown -R www-data /app && php -v | head -1 && phpunit --version'

      - name: Run integration tests (single shop)
        run: |
          docker exec -i -e MULTISTORE=0 psdb sh -s < tests/prepare-test-db.sh
          docker exec --user www-data -w /app psapp phpunit

      - name: Run integration tests (multistore)
        run: |
          docker exec -i -e MULTISTORE=1 psdb sh -s < tests/prepare-test-db.sh
          docker exec --user www-data -w /app psapp phpunit

      - name: Cleanup
        if: always()
        run: |
          docker rm -f psapp psdb || true
          docker volume rm psweb || true
          docker network rm psnet || true
