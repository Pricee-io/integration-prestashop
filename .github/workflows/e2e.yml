name: End-to-end

# The module in a real, throwaway shop for each supported PrestaShop version:
# upgrade from the last release, signed webhook calls over HTTP, and a sync
# run from the back office in a browser (see e2e/run.sh).
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e:
    name: PS ${{ matrix.ps }} - upgrade, webhook and sync
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - ps: '1.7.8.11'
            db: 'mariadb:10.6'
          - ps: '8.2.1'
            db: 'mariadb:10.11'
          - ps: '9.2.1-apache'
            db: 'mariadb:11.4'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The upgrade test installs the last release from its commit
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image (Composer, for the module autoloader)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dev
          tags: pricee-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the end-to-end tests
        run: E2E_DEV_IMAGE=pricee-dev e2e/run.sh '${{ matrix.ps }}' '${{ matrix.db }}'

      - name: Upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-failure-${{ matrix.ps }}
          path: e2e/output/
          if-no-files-found: ignore
